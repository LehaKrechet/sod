# У каждого устройства должен быть свой уникальный node_id.
node_id=1
# Общее число узлов в кластере, включая текущий.
expected_nodes=2

multicast_group=239.10.10.10
multicast_port=50000
# 0.0.0.0 = интерфейс по умолчанию. Можно указать IPv4 Ethernet-интерфейса.
interface=0.0.0.0

# Время ожидания пакетов остальных узлов в одном цикле, мкс.
receive_timeout_us=50
# Интервал heartbeat для обнаружения узлов, миллисекунды
heartbeat_interval_ms=250
# Узел считается отключившимся после отсутствия heartbeat, миллисекунды
peer_timeout_ms=1500
# Период вывода числа активных устройств и их адресов, миллисекунды
peer_status_interval_ms=10
# 0 = бесконечно; положительное число = заданное число циклов.
cycles=500

# Имена файлов создаются в текущем каталоге запуска.
cycle_log=timing_cycles.csv
packet_log=timing_packets.csv

# Отображать временную диаграмму прямо в терминале (true/false)
terminal_graph=true
# Ширина шкалы графика в символах
graph_width=50
